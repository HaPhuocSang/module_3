<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calm - Sleep Stories</title>

    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --calm-purple-dark: #2a2c5a;
            --calm-bg-light: #f4f2fa;
            --calm-text-dark: #333333;
            --calm-text-light: #666666;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: white;
        }

        /* --- Sleep Stories Section --- */
        .sleep-stories-section {
            background-color: var(--calm-bg-light);
            padding: 100px 0;
            position: relative; /* Để căn chỉnh nút tuyệt đối nếu cần */
        }

        /* Ảnh bìa truyện */
        .sloth-card img {
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 350px;
            height: auto;
            object-fit: cover;
        }

        /* Nút điều hướng hình tròn */
        .carousel-control-custom {
            width: 50px;
            height: 50px;
            background-color: #d18ce0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            flex-shrink: 0;
            font-size: 1.5rem;
            box-shadow: 0 5px 15px rgba(209, 140, 224, 0.4);
        }

        .carousel-control-custom:hover {
            background-color: #b06cc0;
            color: white;
            transform: scale(1.1);
        }

        /* Nội dung text bên phải */
        .story-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            line-height: 1.3;
            color: var(--calm-text-dark);
        }

        .story-content h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
        }

        .story-content p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--calm-text-light);
            max-width: 600px;
        }

        /* Tác giả */
        .author-info img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .author-info span {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--calm-text-dark);
            font-family: 'Lato', sans-serif;
        }

        /* Dots */
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            cursor: pointer;
        }
        .dot.active { background-color: var(--calm-purple-dark); }
        .dot.inactive { background-color: #a0a0a0; opacity: 0.5; }

        /* Responsive */
        @media (max-width: 991px) {
            .story-content h2 { font-size: 2rem; }
            .sloth-card img { margin-bottom: 30px; }
            .story-content { text-align: center; }
            .story-content p { margin-left: auto; margin-right: auto; }
            .author-info { justify-content: center; }
            .dots-wrapper { justify-content: center; }
            .carousel-control-custom { display: none; } /* Ẩn nút trên mobile */
        }
    </style>
</head>
<body>

<!-- ================= SLEEP STORIES SECTION ================= -->
<section class="sleep-stories-section">
    <div class="container">
        <div class="row align-items-center">

            <!-- Cột bên trái: Chỉ chứa ảnh và nút Previous -->
            <!-- col-lg-5: Chiếm 5 phần -->
            <div class="col-lg-5 col-12 d-flex justify-content-center justify-content-lg-start align-items-center position-relative">

                <!-- Nút Previous (Nằm bên trái ảnh) -->
                <!-- Dùng position-absolute để đẩy ra ngoài rìa trái -->
                <a href="#" class="carousel-control-custom d-none d-lg-flex position-absolute start-0">
                    <i class="bi bi-chevron-left"></i>
                </a>

                <!-- Ảnh bìa truyện -->
                <div class="sloth-card text-center ms-lg-5"> <!-- Thêm margin-left để tránh đè nút -->
                    <img src="https://images.unsplash.com/photo-1543165365-07232fe0d5ad?q=80&w=500&auto=format&fit=crop"
                         alt="Sienna the Sleepy Sloth"
                         class="img-fluid">
                </div>
            </div>

            <!-- Cột bên phải: Nội dung text và nút Next -->
            <!-- col-lg-7: Chiếm 7 phần -->
            <div class="col-lg-7 col-12 ps-lg-5 position-relative">

                <!-- Nút Next (Nằm bên phải cột chứa chữ) -->
                <!-- Dùng position-absolute để đẩy ra ngoài rìa phải -->
                <a href="#" class="carousel-control-custom d-none d-lg-flex position-absolute end-0 top-50 translate-middle-y">
                    <i class="bi bi-chevron-right"></i>
                </a>

                <div class="story-content pe-lg-5"> <!-- Thêm padding-right để chữ không đè nút Next -->
                    <h2>Drift off with Sleep Stories narrated by iconic voices</h2>

                    <h4>Sienna the Sleepy Sloth</h4>
                    <p>
                        Join bestselling author and beloved comedian David Walliams for a sleepy adventure through an enchanting rainforest.
                    </p>

                    <!-- Tác giả -->
                    <div class="d-flex align-items-center mt-4 author-info">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=100&auto=format&fit=crop"
                             alt="David Walliams"
                             class="me-3">
                        <span>David Walliams</span>
                    </div>

                    <!-- Dots (Chấm tròn điều hướng) -->
                    <div class="d-flex mt-5 gap-2 dots-wrapper">
                        <span class="dot active"></span>
                        <span class="dot inactive"></span>
                        <span class="dot inactive"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
